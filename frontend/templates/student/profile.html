{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4">
  <h4 class="text-indigo mb-3">My profile</h4>
  <form method="post">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" value="{{ current_user.email }}" disabled></div>
    <div class="mb-3"><label class="form-label">Roll number</label>
      <input class="form-control" value="{{ current_user.student.roll_number }}" disabled></div>
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="name" class="form-control" value="{{ form.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Phone</label>
      <input name="phone" class="form-control" value="{{ form.get('phone', '') }}"></div>
    <button class="btn btn-indigo">Save</button>
  </form>
</div></div></div>
{% endblock %}
