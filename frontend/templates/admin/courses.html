{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="text-indigo mb-0">Courses</h3>
  <a href="{{ url_for('admin.course_new') }}" class="btn btn-indigo">New course</a>
</div>
<div class="card">
  <table class="table mb-0 align-middle">
    <thead><tr><th>Code</th><th>Name</th><th>Status</th><th>Exams</th><th></th></tr></thead>
    <tbody>
      {% for c in courses %}
      <tr>
        <td>{{ c.code }}</td><td>{{ c.name }}</td>
        <td><span class="badge bg-{{ c.status|badge }}">{{ c.status }}</span></td>
        <td>{{ c.exams|length }}</td>
        <td class="text-end">
          <a href="{{ url_for('admin.course_edit', course_id=c.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
          <form method="post" action="{{ url_for('admin.course_delete', course_id=c.id) }}" class="d-inline">
            <button class="btn btn-sm btn-outline-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-center text-muted py-4">No courses yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
