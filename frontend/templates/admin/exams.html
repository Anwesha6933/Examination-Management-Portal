{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="text-indigo mb-0">Examinations</h3>
  <a href="{{ url_for('admin.exam_new') }}" class="btn btn-indigo">New examination</a>
</div>
<div class="card">
  <table class="table mb-0 align-middle">
    <thead><tr><th>Title</th><th>Course</th><th>Type</th><th>Marks</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for e in exams %}
      <tr>
        <td>{{ e.title }}</td><td>{{ e.course.code }}</td><td>{{ e.exam_type }}</td><td>{{ e.max_marks }}</td>
        <td><span class="badge bg-{{ e.status|badge }}">{{ e.status }}</span></td>
        <td class="text-end"><a href="{{ url_for('admin.exam_detail', exam_id=e.id) }}" class="btn btn-sm btn-outline-secondary">Open</a></td>
      </tr>
      {% else %}
      <tr><td colspan="6" class="text-center text-muted py-4">No examinations yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
