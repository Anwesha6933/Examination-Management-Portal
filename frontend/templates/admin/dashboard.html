{% extends "base.html" %}
{% block content %}
<h3 class="text-indigo mb-3">Admin dashboard</h3>

{% if pending %}
<div class="alert alert-warning">
  {{ pending }} examiner{{ 's' if pending != 1 }} waiting for approval.
  <a href="{{ url_for('admin.examiners', status='Pending') }}">Review</a>
</div>
{% endif %}

<div class="row g-3">
  {% for label, count, color in tiles %}
  <div class="col-6 col-md-4">
    <div class="tile tile-{{ color }}">
      <div class="count">{{ count }}</div>{{ label }}
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
